# GoReleaser config — https://goreleaser.com
# Releases are cut by release-please (it owns the version, changelog, tag, and
# GitHub Release); GoReleaser builds the artifacts on the tag and appends them.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: webhook
    main: ./cmd/webhook
    binary: external-dns-bunny-webhook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w

# Build the container image with ko (no Dockerfile) on a distroless static
# base, and push it to GHCR.
kos:
  - id: image
    build: webhook
    base_image: gcr.io/distroless/static-debian12:nonroot
    repositories:
      - ghcr.io/internetliquid/external-dns-bunny-webhook
    platforms:
      - linux/amd64
    bare: true
    preserve_import_paths: false
    user: "65532:65532"
    sbom: spdx
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: "https://github.com/internetliquid/external-dns-bunny-webhook"
      org.opencontainers.image.description: "ExternalDNS webhook provider for Bunny.net DNS"
      org.opencontainers.image.licenses: "MIT"

archives:
  - id: archive
    ids:
      - webhook
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# The image's SBOM comes from ko (kos.sbom above). An archive-level sboms block
# would need a syft binary on the runner.

# release-please owns the changelog and release notes.
changelog:
  disable: true

release:
  github:
    owner: internetliquid
    name: external-dns-bunny-webhook
  # release-please has already created the GitHub Release; add the binaries
  # and checksums to it rather than recreating it.
  mode: append
